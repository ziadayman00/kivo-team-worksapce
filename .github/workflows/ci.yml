name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-quality:
    name: Code Quality & Architecture Boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Security Audit
        run: pnpm run audit:deps

      - name: Check Code Formatting (Prettier)
        run: pnpm run format:check

      - name: Lint Code (ESLint)
        run: pnpm run lint

      - name: Check Architecture Boundaries (dependency-cruiser)
        run: pnpm run check:boundaries

      - name: Verify Architecture Boundary Rejection (Fixtures)
        run: pnpm run test:boundaries

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run Web Tests
        run: pnpm --filter @kivo/web test

      - name: Run API Unit Tests
        run: pnpm --filter @kivo/api test
