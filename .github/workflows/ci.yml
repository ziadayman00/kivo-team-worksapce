name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Code Quality, Security & Architecture Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/kivo_test
      DATABASE_URL_TEST: postgresql://postgres:password@localhost:5432/kivo_test
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Dependency Security Audit
        run: pnpm run audit:deps

      - name: Check Code Formatting (Prettier)
        run: pnpm run format:check

      - name: Lint Code (ESLint)
        run: pnpm run lint

      - name: Check Architecture Boundaries (dependency-cruiser)
        run: pnpm run check:boundaries

      - name: Verify Architecture Boundary Rejection (Fixtures)
        run: pnpm run test:boundaries

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run Web Unit Tests
        run: pnpm --filter @kivo/web test

      - name: Run API Unit Tests
        run: pnpm --filter @kivo/api test

      - name: Run PostgreSQL Integration Tests
        run: pnpm run test:integration

      - name: Run Playwright E2E Smoke Tests
        run: pnpm run test:e2e
